# --- Default (공통 설정) ---
spring:
  config:
    import: "optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  profiles:
    default: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

file:
  upload-dir: ./uploads

app:
  base-url: http://localhost:8080 # 백엔드 기본 URL 설정

logging:
  level:
    com.playmatch.playmatch.service.UserService: DEBUG # UserService 디버그 로그 활성화

# --- 구분선 ---
---

# --- Local (내 PC에서 IDE로 직접 실행할 때) ---
spring:
  config:
    activate:
      on-profile: "local" # 'local' 프로필 활성화 시 이 설정 사용
  datasource:
    url: jdbc:postgresql://localhost:5434/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  token:
    expiration-time: 3600000 # 1시간 (밀리초 단위)
# --- 구분선 ---