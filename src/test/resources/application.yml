spring:
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: test
  datasource:
    url: jdbc:postgresql://localhost:5434/${POSTGRES_DB:playmatch_db}
    username: ${POSTGRES_USER:playmatch_user}
    password: ${POSTGRES_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: create
    open-in-view: false

  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6370

  main:
    allow-bean-definition-overriding: true

file:
  upload-dir: ./uploads

jwt:
  secret:
    key: ${JWT_SECRET_KEY:c3ByaW5nLWJvb3Qtc2VjdXJpdHktand0LXR1dG9yaWFsLWppd3QtdHV0b3JpYWwtc3ByaW5nLWJvb3Qtc2VjdXJpdHkK}
  token:
    expiration-time: 3600000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.test.context: DEBUG
    org.hibernate.tool.schema: DEBUG
